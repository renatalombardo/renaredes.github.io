        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fffaf0;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #e8d5c0;
        }
        
        h1 {
            text-align: center;
            color: #7e5a3c;
            font-style: italic;
            border-bottom: 2px dashed #d4b896;
            padding-bottom: 15px;
            margin-top: 0;
        }
        
        .poem {
            background-color: #fdf6e9;
            padding: 10px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 4px solid #d4b896;
            font-style: italic;
            text-align: center;
        }
        
        .text-section {
            margin: 30px 0;
            padding: 15px;
            background-color: #f9f1e3;
            border-radius: 8px;
        }
        
        .cottage-decoration {
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
        }
    </style>

<body>
    <div class="container">
        <h1>Jardín de Poemas</h1>
        <div class="cottage-decoration">🌼 🍂 🍄 🌷</div>
        <div class="text-section">
            <h2>Texto escrito en HTML 1</h2>
            <div class="poem">
                <p>Entre flores y suspiros,</p>
                <p>el tiempo se detiene.</p>
                <p>La brisa acaricia suavemente</p>
                <p>los pétalos que el sol calienta.</p>
            </div>
        </div>
        
        <div class="text-section">
            <h2>Texto escrito en HTML 2</h2>
            <div class="poem">
                <p>El aroma del campo,</p>
                <p>mezcla de tierra y rocío,</p>
                <p>me transporta a mañanas</p>
                <p>de infinito y frío.</p>
            </div>
        </div>        
    </div>

    <script>
        alert("Alerta 1");
        document.write('<div class="container"><div class="text-section"><h2>Mensaje escrito en JavaScript 1</h2><div class="poem"><p>Bajo el viejo roble,</p><p>las historias se tejen,</p><p>entre hojas que caen</p><p>y secretos que se mecen.</p></div></div>');
        document.write('<div class="text-section"><h2>Mensaje escrito en JavaScript 2</h2><div class="poem"><p>La tetera silba,</p><p>el pastel está en el horno,</p><p>y en el jardín florecen</p><p>los recuerdos de todo el año.</p></div></div></div>');
        alert("Alerta 2");
    </script>
</body>
