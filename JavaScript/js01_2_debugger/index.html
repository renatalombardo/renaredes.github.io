<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debuggers</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            color: #127949;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            padding: 15px;
        }

        script {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>a = 10; b = 7; c = a + b</h1>
    <h1>Para visualizar el resultado, abrir devTools con f12</h1>
    <script>
        a = 10;
        b = 7;
        c = a + b;
        console.log('El valor de la variable es ' + c);
    </script>
</body>
</html>
