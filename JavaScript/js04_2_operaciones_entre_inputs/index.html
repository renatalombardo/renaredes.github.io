<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones entre Inputs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: #1c1c1e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
            text-align: center;
        }

        h2 {
            font-size: 14px;
            font-weight: 400;
            color: #98989d;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #98989d;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #2c2c2e;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="number"]:focus {
            outline: none;
            background-color: #3a3a3c;
        }

        .result-container {
            margin: 24px 0;
            padding: 14px;
            background-color: #2c2c2e;
            border-radius: 12px;
        }

        #resultado {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        .buttons-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        button {
            padding: 16px 5px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background-color: #2c2c2e;
            color: #fff;
        }

        button:active {
            background-color: #3a3a3c;
        }

        #Suma {
            background-color: #30d158;
            color: #000;
        }

        #Suma:active {
            background-color: #34c759;
        }

        #Promedio {
            background-color: #0a84ff;
            color: #fff;
        }

        #Promedio:active {
            background-color: #007aff;
        }

        #Mayor {
            background-color: #ff453a;
            color: #fff;
        }

        #Mayor:active {
            background-color: #ff3b30;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #6e6e73;
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            h2 {
                font-size: 13px;
            }
            
            button {
                padding: 14px 5px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Operaciones entre Inputs</h1>
        <h2>Introduce valores en los campos y selecciona la operación a realizar.</h2>

        <div class="input-group">
            <label>Entrada 1</label>
            <input type="number" id="input1" value="0">
        </div>

        <div class="input-group">
            <label>Entrada 2</label>
            <input type="number" id="input2" value="0">
        </div>

        <div class="input-group">
            <label>Entrada 3</label>
            <input type="number" id="input3" value="0">
        </div>

        <div class="result-container">
            <input type="text" id="resultado" readonly placeholder="Resultado">
        </div>

        <div class="buttons-container">
            <button id="Suma">Suma</button>
            <button id="Promedio">Promedio</button>
            <button id="Mayor">Mayor</button>
        </div>
    </div>

    <script>
        input1 = document.getElementById("input1");
        input2 = document.getElementById("input2");
        input3 = document.getElementById("input3");
        resultado = document.getElementById("resultado");

        document.getElementById("Suma").addEventListener("click", function () {
            suma = parseFloat(input1.value) + parseFloat(input2.value) + parseFloat(input3.value);
            resultado.value = suma;
        });

        document.getElementById("Promedio").addEventListener("click", function () {
            promedio = (parseFloat(input1.value) + parseFloat(input2.value) + parseFloat(input3.value)) / 3;
            resultado.value = promedio.toFixed(2);
        });

        document.getElementById("Mayor").addEventListener("click", function () {
            mayor = Math.max(parseFloat(input1.value), parseFloat(input2.value), parseFloat(input3.value));
            resultado.value = mayor;
        });
    </script>
</body>
</html>
