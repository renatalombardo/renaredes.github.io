<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertir a Mayúsculas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #0a0a0a;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Cormorant Garamond', serif;
        }
        
        .container {
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid #3c2a1d;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(120, 0, 200, 0.4), 
                        inset 0 0 15px rgba(90, 0, 150, 0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 2.5rem;
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 1px;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #b8a27c;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid #5d4b3c;
            border-radius: 4px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            color: #d4af37;
            font-family: 'Cormorant Garamond', serif;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        input::placeholder {
            color: #6b5d48;
            font-style: italic;
        }
        
        input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3),
                        inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        input.uppercase {
            text-transform: uppercase;
            font-weight: 600;
            color: #d4af37;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Transformar a Mayúsculas</h1>        
        <div class="input-group">
            <label for="poder">Poder favorito</label>
            <input type="text" id="poder" placeholder="Ej: Volar, Invisibilidad, Superfuerza">
        </div>
        
        <div class="input-group">
            <label for="mascota">Animal mágico</label>
            <input type="text" id="mascota" placeholder="Ej: Dragón, Unicornio, Fénix">
        </div>
    </div>

    <script>
        const inputPoder = document.getElementById('poder');
        const inputMascota = document.getElementById('mascota');

        function resetearInputs() {
            inputPoder.value = '';
            inputMascota.value = '';
            inputPoder.classList.remove('uppercase');
            inputMascota.classList.remove('uppercase');
        }

        window.addEventListener('load', resetearInputs);

        function convertirAMayusculas(input) {
            if (input.value && input.value !== input.placeholder) {
                input.value = input.value.toUpperCase();
                input.classList.add('uppercase');
            }
        }

        inputPoder.addEventListener('blur', function(e) {
            if (e.relatedTarget === inputMascota) {
                convertirAMayusculas(this);
            }
        });

        inputMascota.addEventListener('blur', function(e) {
            if (e.relatedTarget === inputPoder) {
                convertirAMayusculas(this);
            }
        });
        
        inputPoder.addEventListener('focus', function() {
            this.classList.remove('uppercase');
        });
        
        inputMascota.addEventListener('focus', function() {
            this.classList.remove('uppercase');
        });
    </script>
</body>
</html>
