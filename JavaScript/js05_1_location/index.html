<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #5a3e36;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #7c4d3e;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #9d7463;
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(135deg, #ff9a9e 0%, #fbc2eb 100%);
            color: white;
            border: none;
            padding: 18px 25px;
            border-radius: 16px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            width: 100%;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn i {
            margin-right: 15px;
            font-size: 1.5rem;
            width: 30px;
            text-align: center;
        }

        .btn-tumblr {
            background: linear-gradient(135deg, #36465d 0%, #2c3e50 100%);
        }

        .btn-letterboxd {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        }

        .btn-pinterest {
            background: linear-gradient(135deg, #E60023 0%, #BD081C 100%);
        }

        .btn-spotify {
            background: linear-gradient(135deg, #1ED760 0%, #1DB954 100%);
        }

        .btn span {
            flex-grow: 1;
        }

        .btn .arrow {
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover .arrow {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                padding: 15px 20px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Explorar Mundos Digitales</h1>
        <p class="subtitle">Haz clic al sitio que quieras visitar</p>
        
        <div class="buttons-container">
            <button class="btn btn-tumblr" data-url="https://www.tumblr.com/">
                <i class="fab fa-tumblr"></i>
                <span>Explorar Tumblr</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>

            <button class="btn btn-letterboxd" data-url="https://letterboxd.com/">
                <i class="fas fa-film"></i>
                <span>Descubrir Cine</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>
            
            <button class="btn btn-pinterest" data-url="https://www.pinterest.com/">
                <i class="fab fa-pinterest"></i>
                <span>Inspiración en Pinterest</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>
            
            <button class="btn btn-spotify" data-url="https://open.spotify.com/">
                <i class="fab fa-spotify"></i>
                <span>Descubrir Música</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>
        </div>
    </div>

    <script>
        function redireccionar(url) {
            window.location.href = url;
        }

        document.querySelectorAll('.btn').forEach(boton => {
            boton.addEventListener('click', function() {
                const url = this.getAttribute('data-url');
                redireccionar(url);
            });
        });
    </script>

</body>

</html>
