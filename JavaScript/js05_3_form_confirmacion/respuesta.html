<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respuesta al Formulario</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            background-color: #f3e9d9;
            color: #4a3c2a;
            text-align: center;
            padding: 40px 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f3e9d9"/><path d="M0,0 L100,100 M100,0 L0,100" stroke="%23e8d9c0" stroke-width="1.5"/></svg>');
        }

        .cajaRespuesta {
            width: 50%;
            background-color: #e8d9c0;
            padding: 30px;
            text-align: center;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(116, 86, 56, 0.2);
            border: 2px solid #a99275;
            position: relative;
        }

        .cajaRespuesta::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #a99275, #c4ad8d, #a99275);
        }

        h2 {
            color: #6b4c2a;
            margin-bottom: 15px;
            padding-bottom: 10px;
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            border-bottom: 2px solid #a99275;
            margin-top: 0;
        }

        @media (max-width: 900px) {
            .cajaRespuesta {
                width: 80%;
                padding: 30px;
            }
        }

        @media (max-width: 600px) {
            .cajaRespuesta {
                width: 95%;
                padding: 20px;
            }
            
            h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="cajaRespuesta">
        <h2>Respuestas del Formulario</h2>    
    </div>
</body>
</html>
