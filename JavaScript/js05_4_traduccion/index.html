<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Traducción Automática</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            background: #f0f0f0;
        }
        
        #frase {
            background: linear-gradient(to right, 
                violet, indigo, blue, green, yellow, orange, red);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 3em;
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-style: italic;
            text-align: center;
            background-size: 200% auto;
            animation: arcoiris 3s infinite linear;
        }
    
        @keyframes arcoiris {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
<body>
    <div class="frase" id="frase"></div>
    <script>
        const traducciones = {
            "es": "Es hora del espectáculo, amigos!",
            "en": "It is showtime, folks!",
            "fr": "C'est l'heure du spectacle, les amis!",
            "pt": "É hora do show, pessoal!",
            "it": "È ora dello spettacolo, amici!",
            "de": "Es ist Showtime, Leute!",
            "nr": "Det er showtime, folkens!",
            "ru": "Пора шоу, друзья!",
            "zh": "表演时间到了，朋友们！",
            "ja": "ショータイムだ、みんな！"
        };
        let idioma = navigator.language;
        idioma = idioma.substring(0,2);
        const fraseTraducida = traducciones[idioma] || traducciones["en"];
        document.getElementById("frase").textContent = fraseTraducida;
    </script>
</body>
</html>
